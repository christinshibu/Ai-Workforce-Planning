{% extends 'planner/base.html' %}
{% block content %}
<h2>Department Alerts</h2>
<ul class="alert-list">
  {% for alert in alerts %}
  <li class="sev-{{ alert.severity }}">
    <strong>{{ alert.department.name }}</strong> · {{ alert.created_at }}<br>
    {{ alert.message }}
  </li>
  {% empty %}
  <li>No alerts.</li>
  {% endfor %}
</ul>
{% endblock %}
